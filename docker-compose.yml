services:
  app:
    build: .
    container_name: library_app
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-me}
      - DATABASE=/data/library.db
    volumes:
      - library_data:/data
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: library_nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  library_data: