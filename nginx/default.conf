server {
    listen 80;
    server_name _;

    # Статика напрямую через nginx
    location /static/ {
        alias /app/static/;
        expires 7d;
    }

    # Все остальное - на Flask (gunicorn)
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}